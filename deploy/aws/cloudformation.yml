AWSTemplateFormatVersion: "2010-09-09"
Description: "SupportIQ - Production AWS CloudFormation Infrastructure"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for deploying SupportIQ services
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private Subnets for ECS Fargate Tasks
  CertificateArn:
    Type: String
    Description: ACM SSL Certificate ARN for custom domain

Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: supportiq-production
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: supportiq-api-tg
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/supportiq-production
      RetentionInDays: 30

  SecurityGroupEcs:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for SupportIQ ECS tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

Outputs:
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref EcsCluster
  TargetGroupArn:
    Description: ALB Target Group ARN
    Value: !Ref ApiTargetGroup
